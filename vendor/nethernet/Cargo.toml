# Modified by Sculith: standalone manifest and provenance for the local SCTP patch.
[package]
name = "nethernet"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/bedrock-crustaceans/nethernet"

[dependencies]
http.workspace = true
thiserror.workspace = true
bytes.workspace = true
tracing.workspace = true
aes.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
p384.workspace = true
rand.workspace = true
rsa.workspace = true
rtc.workspace = true
byteorder.workspace = true
ipnet.workspace = true

[workspace]
resolver = "3"

[workspace.dependencies]
http = "1"
thiserror = "2"
bytes = "1.12.1"
tracing = "0.1.44"
aes = "0.9.3"
sha2 = "0.11.0"
hmac = "0.13.0"
hex = "0.4.3"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
p384 = { version = "0.14.0", features = ["ecdsa", "pkcs8", "pem"] }
rand = "0.10.3"
rsa = { version = "0.10.0-rc.19", default-features = false, features = ["std", "sha2"] }
rtc = "0.21"
byteorder = "1"
ipnet = "2"

[package.metadata.sculith]
upstream = "https://github.com/bedrock-crustaceans/nethernet/tree/ed552b0b60dc6f8d54e0d7d42a9c66a9b9bdfb99"
