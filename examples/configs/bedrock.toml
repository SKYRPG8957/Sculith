# Development preview: encrypted login, empty packs and authoritative creative building.
# Offline identities are accepted only because the listener is loopback-only.
[server]
motd = "Sculith / Bedrock spawn example"

[world]
snapshot_path = "../../world/region.sculith"

[bedrock]
nethernet_identity_path = "../../world/nethernet-identity.pem"
sessions = true
require_authentication = false
login_timeout_secs = 15

[network.java]
enabled = true
bind = "127.0.0.1:25565"

[network.bedrock]
enabled = true
bind = "127.0.0.1:19132"
