# All content examples. Append .exe to plugin paths on Windows.
[server]
motd = "Sculith / Content demo"

[world]
snapshot_path = "../../world/region.sculith"

[java]
sessions = true
require_authentication = false
login_timeout_secs = 60

[bedrock]
sessions = true
require_authentication = false
login_timeout_secs = 60
nethernet_identity_path = "../../world/nethernet-identity.pem"

[network.java]
bind = "127.0.0.1:25565"

[network.bedrock]
bind = "127.0.0.1:19132"

[content]
source = "../pack/bedrock"
mapping = "../pack/textures.json"

[[plugins]]
path = "../../target/debug/sculith-gameplay-plugin"

[[plugins]]
path = "../../target/debug/sculith-forms-plugin"

[[plugins]]
path = "../../target/debug/sculith-sound-plugin"

[[plugins]]
path = "../../target/debug/sculith-model-plugin"
