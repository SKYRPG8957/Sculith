# Shared input controls through native Bedrock forms and vanilla Java dialogs.
# Append .exe to the plugin path on Windows.
[server]
motd = "Sculith"

[world]
snapshot_path = "../../world/region.sculith"

[java]
sessions = true
require_authentication = false
login_timeout_secs = 60

[bedrock]
sessions = true
require_authentication = false
nethernet_identity_path = "../../world/nethernet-identity.pem"
login_timeout_secs = 60

[network.java]
bind = "127.0.0.1:25565"

[network.bedrock]
bind = "127.0.0.1:19132"

[content]
source = "../pack/bedrock"
mapping = "../pack/textures.json"

[[plugins]]
path = "../../target/debug/sculith-forms-plugin"
args = ["--inputs"]
