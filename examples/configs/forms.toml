# Source-build UI demo. Append .exe to plugin paths on Windows.
[server]
motd = "Sculith / shared forms example"

[world]
snapshot_path = "../../world/region.sculith"

[java]
sessions = true
require_authentication = false
login_timeout_secs = 60

[bedrock]
nethernet_identity_path = "../../world/nethernet-identity.pem"
sessions = true
require_authentication = false
login_timeout_secs = 60

[network.java]
bind = "127.0.0.1:25565"

[network.bedrock]
bind = "127.0.0.1:19132"

[content]
source = "../pack/bedrock"
mapping = "../pack/textures.json"

[[plugins]]
path = "../../target/debug/sculith-gameplay-plugin"

[[plugins]]
path = "../../target/debug/sculith-forms-plugin"
