# Linux/macOS source-build example. On Windows append .exe to the plugin path.
[server]
motd = "Sculith / Rust gameplay preview"

[world]
snapshot_path = "../world/region.sculith"

[java]
sessions = true
require_authentication = false
login_timeout_secs = 30

[bedrock]
sessions = true
require_authentication = false
login_timeout_secs = 30
nethernet = true
nethernet_identity_path = "../world/nethernet-identity.pem"

[network.java]
bind = "127.0.0.1:25565"
enabled = true

[network.bedrock]
bind = "127.0.0.1:19132"
enabled = true

[[plugins]]
path = "../target/debug/sculith-gameplay-plugin"
timeout_ms = 1000
