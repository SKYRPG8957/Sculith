name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Check workspace boundaries
        run: python3 scripts/check_architecture.py
      - name: Format
        run: cargo fmt --all --check
      - name: Format patched transport core
        run: cargo fmt --manifest-path vendor/nethernet/Cargo.toml --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Verify ownership compile-fail doctest
        run: cargo test --workspace --doc --locked
      - name: Test patched transport core
        run: cargo test --locked -p nethernet
      - name: Build server and Rust example plugin
        run: cargo build --workspace --locked
      - name: Exercise real network listeners and plugin
        run: python3 tests/interop/smoke.py
      - name: Exercise executable Bedrock session driver
        run: python3 tests/interop/smoke.py --sessions
      - name: Exercise independent Java shared-world protocol client
        run: python3 tests/interop/java_smoke.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise independent WebRTC client
        run: |
          python -m pip install -r tests/interop/requirements.txt
          python tests/interop/webrtc_smoke.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: tests/interop/gophertunnel/go.sum
      - name: Build independent Bedrock world-spawn client
        working-directory: tests/interop/gophertunnel
        run: go build -mod=readonly -o ../../../target/gophertunnel-probe .
      - name: Exercise independent Bedrock login and world spawn
        run: python tests/interop/gophertunnel_smoke.py --client target/gophertunnel-probe
      - name: Exercise Rust plugin game hooks in both editions
        run: python tests/interop/plugin_game_smoke.py --client target/gophertunnel-probe
      - name: Exercise shared forms, callbacks and recipient isolation
        run: python tests/interop/forms_smoke.py --client target/gophertunnel-probe
      - name: Verify performance comparison contracts
        run: python -m unittest discover -s scripts/bench -p "test_*.py"
      - name: Verify bounded plugin profiling and report lifecycle
        run: python tests/interop/profile_smoke.py
      - name: Verify shared input controls, validation and private callbacks
        run: python tests/interop/custom_forms_smoke.py --client target/gophertunnel-probe
      - name: Exercise shared sounds and private playback
        run: python tests/interop/sound_smoke.py --client target/gophertunnel-probe
      - name: Exercise shared static models and private actor lifecycle
        run: python tests/interop/model_smoke.py --client target/gophertunnel-probe
      - name: Verify packet registration and Rust API-v6 packet/game observations
        run: python tests/interop/events_smoke.py --client target/gophertunnel-probe
      - name: Verify counted inventory transactions and cross-edition held items
        run: python tests/interop/inventory_smoke.py --client target/gophertunnel-probe
      - name: Verify Rust inventory requests, private results and client updates
        run: python tests/interop/plugin_inventory_smoke.py --client target/gophertunnel-probe
      - name: Verify connection phases, redaction and observer backlog handling
        run: python tests/interop/connection_smoke.py --client target/gophertunnel-probe
      - name: Verify Rust world operations and shared atomic block commits
        run: python tests/interop/world_api_smoke.py --client target/gophertunnel-probe
      - name: Verify bounded world mailbox profiling and mixed-edition requests
        run: python tests/interop/world_profile_smoke.py --client target/gophertunnel-probe
      - name: Verify live checkpoints, forced termination and world recovery
        run: python tests/interop/autosave_smoke.py
      - name: Verify authoritative cross-edition held items and empty hands
        run: python tests/interop/equipment_smoke.py --client target/gophertunnel-probe
      - name: Verify cross-edition player visibility, movement and leave
        run: python tests/interop/peer_smoke.py --client target/gophertunnel-probe
      - name: Exercise shared packs, native cache and consent keepalive
        run: python tests/interop/pack_delivery_smoke.py --client target/gophertunnel-probe --wait-for-keepalive
      - name: Exercise advertised pack URL through an independent HTTP proxy
        run: python tests/interop/pack_delivery_smoke.py --client target/gophertunnel-probe --public-http
