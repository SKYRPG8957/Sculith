name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Format patched transport core
        run: cargo fmt --manifest-path vendor/nethernet/Cargo.toml --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Verify ownership compile-fail doctest
        run: cargo test --workspace --doc --locked
      - name: Test patched transport core
        run: cargo test --locked -p nethernet
      - name: Build server and Rust example plugin
        run: cargo build --workspace --locked
      - name: Exercise real network listeners and plugin
        run: python3 scripts/smoke.py
      - name: Exercise executable Bedrock session driver
        run: python3 scripts/smoke.py --sessions
      - name: Exercise independent Java shared-world protocol client
        run: python3 scripts/java_smoke.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise independent WebRTC client
        run: |
          python -m pip install -r scripts/requirements-webrtc.txt
          python scripts/webrtc_smoke.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: tests/interop/gophertunnel/go.sum
      - name: Build independent Bedrock world-spawn client
        working-directory: tests/interop/gophertunnel
        run: go build -mod=readonly -o ../../../target/gophertunnel-probe .
      - name: Exercise independent Bedrock login and world spawn
        run: python scripts/gophertunnel_smoke.py --client target/gophertunnel-probe
