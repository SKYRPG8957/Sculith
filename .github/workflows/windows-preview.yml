name: Windows preview

on:
  workflow_dispatch:
    inputs:
      verify_installer:
        description: 'Verify the published preview installer instead of rebuilding'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-preview.yml'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'examples/**'
      - 'scripts/smoke.py'
      - 'scripts/package_release.py'
      - 'distribution/**'
      - 'LICENSES/**'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.verify_installer
    runs-on: windows-latest
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      PYTHONUTF8: '1'
      SCULITH_PREVIEW_VERSION: 'v0.1.0-preview.3'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-crt-static-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: windows-crt-static-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Install pinned toolchain
        run: rustup show
      - name: Check and test native Windows build
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --doc --locked
          exit $LASTEXITCODE
      - name: Build portable release binaries with static CRT
        run: cargo build --workspace --release --locked
      - name: Exercise Windows network, plugin, graceful shutdown and persistence
        run: |
          python scripts/smoke.py --server target/release/sculith.exe --plugin target/release/sculith-welcome.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke.py --server target/release/sculith.exe --plugin target/release/sculith-welcome.exe --sessions
          exit $LASTEXITCODE
      - name: Parse the PowerShell installer
        run: |
          $Tokens = $null
          $ParseErrors = $null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install.ps1), [ref]$Tokens, [ref]$ParseErrors) | Out-Null
          if ($ParseErrors.Count -gt 0) { throw ($ParseErrors | Out-String) }
      - name: Package Windows preview and dependency licenses
        run: python scripts/package_release.py --binary target/release/sculith.exe --version $env:SCULITH_PREVIEW_VERSION --output dist
      - name: Verify extracted package configuration and CLI
        run: |
          Expand-Archive "dist/sculith-$env:SCULITH_PREVIEW_VERSION-windows-x86_64.zip" -DestinationPath 'package test'
          & '.\package test\sculith.exe' check --config '.\package test\sculith.local.example.toml'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '.\package test\sculith.exe' --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Launcher = (Resolve-Path '.\package test\start.cmd').Path
          & $Launcher --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Settings = (Resolve-Path '.\package test\sculith.toml').Path
          Add-Content -LiteralPath $Settings '# Existing user setting must be preserved'
          $Before = (Get-FileHash -LiteralPath $Settings).Hash
          & $Launcher --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $Settings).Hash -ne $Before) { throw 'Launcher overwrote existing settings' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          path: dist/*
          if-no-files-found: error
  verify-install:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install public preview using Windows PowerShell 5.1
        shell: powershell
        run: |
          $InstallPath = Join-Path $env:RUNNER_TEMP 'Sculith install test'
          & .\scripts\install.ps1 -Destination $InstallPath
          & (Join-Path $InstallPath 'start.cmd') --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $InstallPath 'diagnose.cmd') --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Settings = Join-Path $InstallPath 'sculith.toml'
          $Before = (Get-FileHash -LiteralPath $Settings).Hash
          $Refused = $false
          try { & .\scripts\install.ps1 -Destination $InstallPath }
          catch { $Refused = $true }
          if (-not $Refused -or (Get-FileHash -LiteralPath $Settings).Hash -ne $Before) { throw 'Installer did not preserve the existing directory' }
      - name: Verify the documented one-command installation
        shell: powershell
        run: |
          $Work = Join-Path $env:RUNNER_TEMP 'sculith-one-command'
          New-Item -ItemType Directory -Path $Work | Out-Null
          Push-Location $Work
          try {
            irm https://raw.githubusercontent.com/SKYRPG8957/Sculith/main/scripts/install.ps1 | iex
            & .\Sculith\start.cmd --check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally { Pop-Location }
