name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path tests/interop/plugin/Cargo.toml --check
      - run: cargo clippy --locked -p sculith-packs -p pumpkin-codegen -p sculith-protocol -p sculith-config -p sculith-world -p sculith-core -p sculith -p sculith-interop-connections --features sculith/plugin-v0_2 --all-targets -- -D warnings
      - run: cargo test --locked -p sculith-packs -p sculith-protocol -p sculith-config -p sculith-world -p sculith-core --lib
      - run: cargo test --locked -p sculith-protocol --test bedrock_controls
      - run: cargo test --locked -p pumpkin-wasm-host-v0_2 -p pumpkin-plugin-runtime --lib
      - run: cargo build --locked --release --target wasm32-wasip2 --manifest-path tests/interop/plugin/Cargo.toml
      - run: cargo build --locked -p sculith -p sculith-interop-connections
      - run: python3 tests/interop/world_guard.py target/debug/sculith
