name: Rust

on:
  push:
    branches: [main, codex/pumpkin-foundation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p pumpkin-protocol -p pumpkin-config -p pumpkin-world -p pumpkin-core -p pumpkin --all-targets -- -D warnings
      - run: cargo test --locked -p pumpkin-protocol -p pumpkin-config -p pumpkin-world -p pumpkin-core --lib
      - run: cargo build --locked -p pumpkin --bin sculith
      - run: python3 tests/interop/world_guard.py target/debug/sculith
