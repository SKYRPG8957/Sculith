name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-crt-static-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            windows-crt-static-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            windows-crt-static-
      - name: Install pinned toolchain
        run: rustup show
      - name: Check workspace boundaries
        run: python scripts/check_architecture.py
      - name: Check and test native Windows build
        env:
          RUST_LOG: 'warn,sculith::protocol::bedrock::nethernet=debug,nethernet=debug,nethernet_tokio=debug,rtc_ice=debug'
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path vendor/nethernet/Cargo.toml --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nethernet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --doc --locked
          exit $LASTEXITCODE
      - name: Build portable release binaries with static CRT
        run: cargo build --workspace --release --locked
      - name: Exercise Windows network, plugin, graceful shutdown and persistence
        run: |
          python tests/interop/smoke.py --server target/release/sculith.exe --plugin target/release/sculith-welcome.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/interop/smoke.py --server target/release/sculith.exe --plugin target/release/sculith-welcome.exe --sessions
          exit $LASTEXITCODE
      - name: Verify independent Java shared-world protocol client
        run: python tests/interop/java_smoke.py --server target/release/sculith.exe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify independent WebRTC interoperability against the release executable
        run: |
          python -m pip install -r tests/interop/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/interop/webrtc_smoke.py --server target/release/sculith.exe
          exit $LASTEXITCODE
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: tests/interop/gophertunnel/go.sum
      - name: Build independent Bedrock world-spawn client
        working-directory: tests/interop/gophertunnel
        run: go build -mod=readonly -o ../../../target/gophertunnel-probe.exe .
      - name: Verify independent Bedrock login and world spawn
        run: python tests/interop/gophertunnel_smoke.py --client target/gophertunnel-probe.exe --server target/release/sculith.exe
      - name: Verify Rust plugin game hooks in both editions
        run: python tests/interop/plugin_game_smoke.py --client target/gophertunnel-probe.exe --server target/release/sculith.exe --plugin target/release/sculith-gameplay-plugin.exe
      - name: Verify shared forms, callbacks and recipient isolation
        run: python tests/interop/forms_smoke.py --client target/gophertunnel-probe.exe --server target/release/sculith.exe --plugin target/release/sculith-forms-plugin.exe
      - name: Verify shared sound assets, playback packets and recipient isolation
        run: python tests/interop/sound_smoke.py --client target/gophertunnel-probe.exe --server target/release/sculith.exe --plugin target/release/sculith-sound-plugin.exe
      - name: Verify shared models, private actors and show-replace-hide lifecycle
        run: python tests/interop/model_smoke.py --client target/gophertunnel-probe.exe --server target/release/sculith.exe --plugin target/release/sculith-model-plugin.exe
      - name: Verify authoritative cross-edition held items and empty hands
        run: python tests/interop/equipment_smoke.py --client target/gophertunnel-probe.exe --server target/release/sculith.exe
      - name: Verify packet registration, public chat and private Rust command hooks
        run: python tests/interop/events_smoke.py --client target/gophertunnel-probe.exe --server target/release/sculith.exe --plugin target/release/sculith-events-plugin.exe
      - name: Verify counted inventory transactions and cross-edition held items
        run: python tests/interop/inventory_smoke.py --client target/gophertunnel-probe.exe --server target/release/sculith.exe --plugin target/release/sculith-events-plugin.exe
      - name: Verify Rust inventory requests, private results and client updates
        run: python tests/interop/plugin_inventory_smoke.py --client target/gophertunnel-probe.exe --server target/release/sculith.exe --plugin target/release/sculith-inventory-fixture.exe
      - name: Verify connection phases, redaction and observer backlog handling
        run: python tests/interop/connection_smoke.py --client target/gophertunnel-probe.exe --server target/release/sculith.exe --plugin target/release/sculith-connection-fixture.exe
      - name: Verify cross-edition player visibility, movement and leave
        run: python tests/interop/peer_smoke.py --client target/gophertunnel-probe.exe --server target/release/sculith.exe
      - name: Verify shared packs, native cache and consent keepalive
        run: python tests/interop/pack_delivery_smoke.py --client target/gophertunnel-probe.exe --server target/release/sculith.exe --wait-for-keepalive
      - name: Verify advertised pack URL through an independent HTTP proxy
        run: python tests/interop/pack_delivery_smoke.py --client target/gophertunnel-probe.exe --server target/release/sculith.exe --public-http
