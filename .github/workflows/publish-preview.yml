name: Publish verified Windows preview

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful main-branch Windows preview build run ID'
        required: true
        type: string
      version:
        description: 'Preview version in the archive, e.g. v0.1.0-preview.2'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Download the successfully tested immutable build
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: windows-preview
          path: dist
      - name: Verify archive integrity and exact source revision
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_VERSION: ${{ inputs.version }}
          PREVIEW_RUN_ID: ${{ inputs.run_id }}
        run: |
          python3 scripts/verify_release.py --directory dist --version "$PREVIEW_VERSION" --run-id "$PREVIEW_RUN_ID"
      - name: Publish the development preview and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ steps.verified.outputs.commit }}
          ARCHIVE: ${{ steps.verified.outputs.archive }}
        run: |
          gh release create "$PREVIEW_VERSION" \
            --repo SKYRPG8957/Sculith \
            --target "$SOURCE_COMMIT" \
            --prerelease --latest=false \
            --title "Sculith $PREVIEW_VERSION (Windows)" \
            --notes-file "docs/releases/$PREVIEW_VERSION.md" \
            "dist/$ARCHIVE" dist/SHA256SUMS.txt
