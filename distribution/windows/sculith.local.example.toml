# Local development preview; not a public server configuration.
[server]
motd = "Sculith / local shared-world preview"
max_players = 20

[world]
snapshot_path = "world/region.sculith"

[java]
sessions = true
require_authentication = false
login_timeout_secs = 60

[bedrock]
sessions = true
require_authentication = false
login_timeout_secs = 60
nethernet = true
nethernet_identity_path = "world/nethernet-identity.pem"

[network.java]
enabled = true
bind = "127.0.0.1:25565"

[network.bedrock]
enabled = true
bind = "127.0.0.1:19132"

[[plugins]]
path = "plugins/sculith-gameplay-plugin.exe"
timeout_ms = 1000

[[plugins]]
path = "plugins/sculith-forms-plugin.exe"
timeout_ms = 1000

[[plugins]]
path = "plugins/sculith-sound-plugin.exe"
timeout_ms = 1000

[[plugins]]
path = "plugins/sculith-model-plugin.exe"
timeout_ms = 1000

# One authored Bedrock pack; Java receives supported textures, sounds and static models.
[content]
source = "packs/sculith-demo"
mapping = "packs/sculith-demo-textures.json"
