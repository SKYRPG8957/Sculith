[server]
motd = "Sculith"
max_players = 20

[world]
snapshot_path = "world/region.sculith"
autosave_interval_secs = 60

[java]
sessions = true
require_authentication = true

[bedrock]
sessions = true
require_authentication = true
nethernet_identity_path = "world/nethernet-identity.pem"

[network.java]
bind = "127.0.0.1:25565"

[network.bedrock]
bind = "127.0.0.1:19132"
