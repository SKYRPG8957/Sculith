[package]
name = "sculith-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sculith"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bedrock = { git = "https://github.com/bedrock-crustaceans/bedrock-rs.git", rev = "5221fcae8cc8468f523f3f58f129cb308e9d3369", default-features = false, features = ["network-tokio", "protocol-v2225", "protocol-unknown", "auth-ureq"] }
raknet = { git = "https://github.com/bedrock-crustaceans/raknet.git", version = "0.1.0" }
ureq = "3"
uuid = { version = "1.18", features = ["v4"] }
nbtx = { git = "https://github.com/bedrock-crustaceans/nbtx" }
nethernet = { git = "https://github.com/bedrock-crustaceans/nethernet.git", rev = "ed552b0b60dc6f8d54e0d7d42a9c66a9b9bdfb99" }
bytes = "1.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
clap.workspace = true
sculith-core = { path = "../sculith-core" }
sculith-packs = { path = "../sculith-packs" }
sculith-plugin-api = { path = "../sculith-plugin-api" }
sculith-world = { path = "../sculith-world" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
nethernet-tokio = { git = "https://github.com/bedrock-crustaceans/nethernet.git", rev = "ed552b0b60dc6f8d54e0d7d42a9c66a9b9bdfb99" }

[lints]
workspace = true
