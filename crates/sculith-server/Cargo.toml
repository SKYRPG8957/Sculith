[package]
name = "sculith-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sculith"
path = "src/main.rs"

[dependencies]
aes = "=0.8.4"
cfb8 = "=0.8.1"
aws-lc-rs = { version = "=1.19.0", default-features = false, features = ["alloc", "non-fips", "prebuilt-nasm"] }
sha1 = "=0.10.7"
zeroize = "1"
anyhow.workspace = true
bedrock = { git = "https://github.com/bedrock-crustaceans/bedrock-rs.git", rev = "5221fcae8cc8468f523f3f58f129cb308e9d3369", default-features = false, features = ["network-tokio", "protocol-v2225", "protocol-unknown", "protocol-packet-meta", "auth-ureq"] }
raknet = { git = "https://github.com/bedrock-crustaceans/raknet.git", version = "0.1.0" }
ureq = { version = "3", features = ["platform-verifier"] }
uuid.workspace = true
nbtx = { git = "https://github.com/bedrock-crustaceans/nbtx" }
nethernet = { git = "https://github.com/bedrock-crustaceans/nethernet.git", rev = "ed552b0b60dc6f8d54e0d7d42a9c66a9b9bdfb99" }
bytes = "1.12"
futures-util.workspace = true
md-5 = "=0.10.6"
http = "1"
url = "=2.5.8"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
if-addrs = "0.15"
clap.workspace = true
sculith-game = { path = "../sculith-game" }
sculith-runtime = { path = "../sculith-runtime" }
sculith-plugin-host = { path = "../sculith-plugin-host" }
sculith-core = { path = "../sculith-core" }
sculith-packs = { path = "../sculith-packs" }
sculith-plugin-api = { path = "../sculith-plugin-api" }
sculith-world = { path = "../sculith-world" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
rcgen = "0.14.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
nethernet-tokio = { git = "https://github.com/bedrock-crustaceans/nethernet.git", rev = "ed552b0b60dc6f8d54e0d7d42a9c66a9b9bdfb99" }

[lints]
workspace = true
