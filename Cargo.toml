[workspace]
members = ["crates/*", "examples/plugins/*", "tests/fixtures/*"]
default-members = ["crates/sculith-server"]
resolver = "3"
exclude = ["vendor/nethernet"]

[patch."https://github.com/bedrock-crustaceans/nethernet.git"]
nethernet = { path = "vendor/nethernet" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/SKYRPG8957/Sculith"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "sync", "signal", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4"] }
futures-util = "=0.3.34"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"
